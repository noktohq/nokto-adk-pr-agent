name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --dev --extra lint

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format . --check

      - name: Spelling
        run: uv run codespell

      - name: Type check
        run: uv run ty check .

      - name: Unit tests
        run: uv run pytest tests/unit -q
